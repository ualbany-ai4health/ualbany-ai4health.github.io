<li class="pub">
  <span class="pub-title">{% if include.p.doi %}<a href="https://doi.org/{{ include.p.doi }}">{{ include.p.title }}</a>{% else %}{{ include.p.title }}{% endif %}</span>
  <span class="pub-authors">{{ include.p.authors }}</span>
  <span class="pub-venue"><em>{{ include.p.venue }}</em>, {{ include.p.year }}{% if include.p.doi %} · <span class="doi">doi:{{ include.p.doi }}</span>{% endif %}</span>
</li>
