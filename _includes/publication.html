{% if include.p.doi %}<a class="pub" href="https://doi.org/{{ include.p.doi }}">{% else %}<div class="pub">{% endif %}
  <span class="pub-year">{{ include.p.year }}</span>
  <span class="pub-main">
    <span class="pub-title">{{ include.p.title }}</span>
    <span class="pub-authors">{{ include.p.authors }}</span>
  </span>
  <span class="pub-venue">{{ include.p.venue }}</span>
{% if include.p.doi %}</a>{% else %}</div>{% endif %}
