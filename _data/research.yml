# Research themes shown on the home and research pages.
# image: file in assets/img/research/ · unit: the data and scale, shown in teal
- key: sleep
  title: "Sleep and biosignals"
  unit: "EEG · EOG · EMG · 30 s epochs"
  image: sleep.webp
  short: "Sleep staging from overnight recordings, including newborns in intensive care."
  text: >-
    Machine learning on physiological time series: sleep staging from
    polysomnography, including newborns in intensive care, EEG-based detection
    of neurological and psychiatric conditions, and ECG classification.
- key: imaging
  title: "Brain imaging"
  unit: "MRI · CT · 1 mm voxels"
  image: imaging.webp
  short: "Alzheimer's, stroke and hemorrhage from scans, validated per patient, not per slice."
  text: >-
    Deep learning models for brain MRI and CT, with a focus on Alzheimer's
    disease, stroke and hemorrhage. We validate at the level of the patient
    rather than the image slice, so that slices from one person never appear
    in both training and test data.
- key: wearables
  title: "Wearables"
  unit: "ECG · skin conductance"
  image: wearables.webp
  short: "Stress and emotion from body-worn sensors, and how the hardware changes the answer."
  text: >-
    Recognizing emotional and stress states from wearable sensors such as ECG
    and skin conductance, and auditing how the measurement hardware shapes the
    results.
- key: neuro
  title: "Neurodegeneration"
  unit: "Alzheimer's · dementia"
  image: neuro.webp
  short: "Earlier detection and staging from imaging and physiology."
  text: >-
    Detection and staging of Alzheimer's disease from imaging and physiological
    data, aimed at earlier diagnosis and better care.
- key: llm
  title: "Language models for health"
  unit: "LLM · multimodal"
  image: llm.webp
  short: "Models that reason over signals, records and scans together."
  text: >-
    Large language models and multimodal frameworks that combine structured
    data, signals, images and text for clinical and public-health questions.
- key: population
  title: "Population health"
  unit: "Survey · registry"
  image: population.webp
  short: "Risk factors of substance use from population-scale data."
  text: >-
    Machine learning on population-scale survey and registry data, for example
    identifying risk factors of substance use.
