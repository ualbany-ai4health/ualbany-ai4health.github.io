# Project overviews as flows, transcribed from each project's overview figure.
# Same schema as _data/ecosystem.yml (see _includes/flow.html).

depression:
  stages:
    - title: "Multimodal data"
      items:
        - { name: "EEG & neurophysiology", note: "frequency bands, connectivity, sleep patterns, neural biomarkers" }
        - { name: "Physiology & behaviour", note: "HRV, activity and sleep, skin conductance, daily routines" }
        - { name: "Clinical & multi-omics", note: "EHR, genomics, metabolomics, psychometric scales, medication history" }
        - { name: "Speech & language", note: "prosody, voice quality, linguistic features, daily-life audio" }
        - { name: "Text & context", note: "clinical notes, transcripts, written language, social media with consent" }
    - title: "Harmonise & reason"
      core: { title: "Multimodal AI engine", sub: "Reasoning · learning · personalisation" }
      chips_title: "Inside the engine"
      chips: ["Biomedical knowledge graph", "Graph neural networks", "Neuro-symbolic & causal AI", "Language & multimodal models", "Dynamic patient modelling"]
    - title: "Analysis & prediction"
      items:
        - { name: "Detection & classification", note: "mild, moderate, severe" }
        - { name: "Risk stratification & early warning", note: "onset, relapse, suicidal risk" }
        - { name: "Symptom trajectory modelling", note: "longitudinal prediction" }
        - { name: "Biomarker & subtype discovery", note: "multimodal, patient-specific" }
        - { name: "Treatment response prediction", note: "medication, psychotherapy, neuromodulation" }
        - { name: "What-if & counterfactual analysis" }
    - title: "Personalised interventions"
      items:
        - { name: "Targeted treatment recommendations" }
        - { name: "Digital therapeutics", note: "mindfulness, CBT, neuromodulation" }
        - { name: "Real-time monitoring & adaptive support", note: "wearables and mobile apps" }
        - { name: "Personalised feedback & early alerts" }
        - { name: "Context-aware interventions", note: "lifestyle, sleep, activity, environment" }
        - { name: "Clinician decision support", note: "evidence-based, explainable" }
  loop:
    title: "Human-centred, context-aware loop"
    steps: ["Patient context", "Continuous learning", "Clinician in the loop", "Explainable AI"]
  band:
    title: "Trustworthy, secure & ethical AI"
    chips: ["Privacy & data security", "Fairness & bias mitigation", "Explainability", "Robustness & reliability", "Regulatory compliance & ethics"]
  outcomes: ["Early, accurate detection", "Personalised care", "Improved outcomes", "Better mental health"]

