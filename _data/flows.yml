  outcomes: ["Earlier detection", "Personalised care", "Improved outcomes", "Healthier hearts"]

bci-game:
  stages:
    - title: "Brain signal acquisition"
      items:
        - { name: "Non-invasive EEG headset", note: "channels such as Fz, C3, Cz, C4, Pz" }
        - { name: "Raw EEG stream", note: "sent wirelessly in real time" }
    - title: "Signal processing"
      items:
        - { name: "Preprocessing", note: "filtering, artifact removal" }
        - { name: "Feature extraction", note: "time, frequency and spatial features" }
        - { name: "Mental-state decoding", note: "intention, attention, motor imagery" }
    - title: "Intent recognition"
      core: { title: "BCI system", sub: "Real-time · adaptive · personalised" }
      chips_title: "Classified intentions"
      chips: ["Move", "Aim", "Jump", "Shoot", "Idle / rest"]
    - title: "Game control"
      items:
        - { name: "Real-time command execution", note: "decoded intentions become game actions" }
        - { name: "Visual & auditory feedback", note: "the player sees and hears the result" }
  loop:
    title: "Closed loop: feedback & adaptation"
    steps: ["Performance feedback", "Adaptive learning per player", "Neurofeedback", "Back to the player"]
  outcomes: ["Hands-free control", "Personalised & adaptive", "Non-invasive & safe", "Neurorehabilitation & training"]
