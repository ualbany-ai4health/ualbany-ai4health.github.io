      core: { title: "Cardio Twin", sub: "A digital twin of one patient's heart" }
      chips_title: "What the twin does"
      chips: ["Personalised anatomy & physiology", "Multi-scale modelling", "Disease progression simulation", "Treatment response prediction", "What-if analysis", "Virtual stress testing", "Risk stratification", "Digital biomarkers"]
      chips2_title: "Agents"
      chips2: ["Monitoring", "Prediction", "Simulation", "Treatment", "Care coordination"]
    - title: "Clinical applications"
      items:
        - { name: "Real-time monitoring & early warning", note: "continuous risk, anomaly alerts" }
        - { name: "Personalised treatment planning", note: "drug therapy, lifestyle, adaptive strategies" }
        - { name: "Precision risk stratification", note: "patient-specific risk profiles" }
        - { name: "Clinical decision support", note: "evidence-based, interpretable, clinician in the loop" }
        - { name: "Patient engagement & remote care", note: "feedback, coaching, self-management" }
